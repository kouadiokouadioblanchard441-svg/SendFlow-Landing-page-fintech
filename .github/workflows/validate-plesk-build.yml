name: Validate SendFlow Plesk build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sendflow-plesk-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sendflow_ci
          POSTGRES_PASSWORD: sendflow_ci
          POSTGRES_DB: sendflow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sendflow_ci -d sendflow_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_URL: ${{ vars.APP_URL || 'https://sendflow.africa' }}
      PUBLIC_URL: ${{ vars.PUBLIC_URL }}
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
      BASE_PATH: /

    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Build production files
        run: pnpm run deploy:plesk

      - name: Smoke-test the Plesk runtime bundle
        env:
          NEON_DATABASE_URL: postgresql://sendflow_ci:sendflow_ci@127.0.0.1:5432/sendflow_ci
        run: |
          set -euo pipefail
          port=4179
          log_file="$(mktemp)"
          smoke_dir=""
          (
            cd dist
            exec env NODE_ENV=production PORT="$port" PUBLIC_SITE_URL="$APP_URL" node ./index.cjs
          ) >"$log_file" 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            if [[ -n "$smoke_dir" ]]; then
              rm -rf "$smoke_dir"
            fi
            rm -f "$log_file"
          }
          trap cleanup EXIT

          ready=0
          for _ in $(seq 1 30); do
            if curl --silent --show-error --fail "http://127.0.0.1:$port/api/healthz" >/dev/null 2>&1; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$log_file"
              echo "::error::The production bundle exited before becoming healthy."
              exit 1
            fi
            sleep 1
          done
          if [[ "$ready" != 1 ]]; then
            cat "$log_file"
            echo "::error::The production bundle did not become healthy within 30 seconds."
            exit 1
          fi

          smoke_dir="$(mktemp -d)"

          while IFS='|' read -r route locale marker; do
            page_file="$smoke_dir/page.html"
            status="$(curl --silent --show-error --output "$page_file" --write-out '%{http_code}' \
              "http://127.0.0.1:$port$route")"
            if [[ "$status" != 200 ]]; then
              echo "::error::Local production route $route returned HTTP $status."
              exit 1
            fi

            if ! grep -Fq "<html lang=\"$locale\">" "$page_file"; then
              echo "::error::Local production route $route did not serve the expected $locale document."
              exit 1
            fi

            js_path="$(grep -oE 'src="[^"]+\.js"' "$page_file" | head -n 1 | cut -d '"' -f 2)"
            css_path="$(grep -oE 'href="[^"]+\.css"' "$page_file" | head -n 1 | cut -d '"' -f 2)"
            if [[ -z "$js_path" || -z "$css_path" ]]; then
              echo "::error::Local production route $route does not reference the expected JavaScript and CSS bundles."
              exit 1
            fi

            js_type="$(curl --silent --show-error --fail --output "$smoke_dir/app.js" --write-out '%{content_type}' \
              "http://127.0.0.1:$port$js_path")"
            css_type="$(curl --silent --show-error --fail --output "$smoke_dir/app.css" --write-out '%{content_type}' \
              "http://127.0.0.1:$port$css_path")"
            if [[ ! -s "$smoke_dir/app.js" || "$js_type" != *javascript* ]]; then
              echo "::error::The JavaScript bundle referenced by $route did not load as a JavaScript resource."
              exit 1
            fi
            if [[ ! -s "$smoke_dir/app.css" || "$css_type" != *text/css* ]]; then
              echo "::error::The stylesheet referenced by $route did not load as a CSS resource."
              exit 1
            fi
            if ! grep -Fq "$marker" "$smoke_dir/app.js"; then
              echo "::error::The production bundle for $route is missing its expected localized content marker: $marker"
              exit 1
            fi

            echo "Verified localized marker and compiled assets for $route."
          done <<'ROUTES'
          /|fr|L’argent circule.
          /fonctionnalites/|fr|Tout ce dont vous avez besoin pour envoyer
          /en/|en|Money moves.
          /en/features/|en|Everything you need to send and receive money simply
          ROUTES

          favicon_path="$(grep -oE 'href="[^"]*sendflow-favicon\.png"' "$smoke_dir/page.html" | head -n 1 | cut -d '"' -f 2)"
          if [[ -z "$favicon_path" ]]; then
            echo "::error::The production HTML does not reference the expected SendFlow favicon."
            exit 1
          fi
          favicon_type="$(curl --silent --show-error --fail --output "$smoke_dir/favicon.png" --write-out '%{content_type}' \
            "http://127.0.0.1:$port$favicon_path")"
          if [[ ! -s "$smoke_dir/favicon.png" || "$favicon_type" != *image/png* ]]; then
            echo "::error::The SendFlow favicon did not load as a PNG resource."
            exit 1
          fi

      - name: Simulate the Passenger hook without PORT
        env:
          NEON_DATABASE_URL: postgresql://sendflow_ci:sendflow_ci@127.0.0.1:5432/sendflow_ci
        run: |
          set -euo pipefail
          port=4180
          log_file="$(mktemp)"
          passenger_shim="$(mktemp --suffix=.cjs)"
          cat >"$passenger_shim" <<'SHIM'
          const assert = require("node:assert/strict");
          const http = require("node:http");
          const originalListen = http.Server.prototype.listen;
          let configured = false;

          globalThis.PhusionPassenger = {
            configure(options) {
              assert.deepEqual(options, { autoInstall: false });
              assert.equal(configured, false, "Passenger configure should run once");
              configured = true;
              console.log("PASSENGER_SIMULATION_CONFIGURE_OK");
            },
          };

          http.Server.prototype.listen = function (...args) {
            assert.equal(configured, true, "Passenger configure must run before listen");
            assert.equal(args[0], "passenger", "application must call listen('passenger')");
            assert.equal(args.length, 2, "expected listen('passenger', callback)");
            console.log("PASSENGER_SIMULATION_LISTEN_OK");
            return originalListen.call(
              this,
              Number(process.env.PASSENGER_SIMULATION_PORT),
              "127.0.0.1",
              args[1],
            );
          };
          SHIM

          cleanup() {
            if [[ -n "${server_pid:-}" ]]; then
              kill "$server_pid" 2>/dev/null || true
              wait "$server_pid" 2>/dev/null || true
            fi
            rm -f "$log_file" "$passenger_shim"
          }
          trap cleanup EXIT

          (
            cd dist
            exec env -u PORT NODE_ENV=production \
              NODE_OPTIONS="--require=$passenger_shim" \
              PASSENGER_SIMULATION_PORT="$port" \
              PUBLIC_SITE_URL="$APP_URL" \
              node ./index.cjs
          ) >"$log_file" 2>&1 &
          server_pid=$!

          ready=0
          for _ in $(seq 1 30); do
            if curl --silent --show-error --fail "http://127.0.0.1:$port/api/healthz" >/dev/null 2>&1; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$log_file"
              echo "::error::The Passenger-simulated production bundle exited before becoming healthy."
              exit 1
            fi
            sleep 1
          done
          if [[ "$ready" != 1 ]]; then
            cat "$log_file"
            echo "::error::The Passenger-simulated production bundle did not become healthy within 30 seconds."
            exit 1
          fi

          for marker in PASSENGER_SIMULATION_CONFIGURE_OK PASSENGER_SIMULATION_LISTEN_OK; do
            if ! grep -q "$marker" "$log_file"; then
              cat "$log_file"
              echo "::error::The Passenger simulation did not verify $marker."
              exit 1
            fi
          done

          for route in / /fonctionnalites/ /en/; do
            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              "http://127.0.0.1:$port$route")"
            if [[ "$status" != 200 ]]; then
              echo "::error::Passenger-simulated public route $route returned HTTP $status."
              exit 1
            fi
          done
