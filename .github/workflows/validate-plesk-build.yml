name: Validate SendFlow Plesk build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sendflow-plesk-build-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  plesk-build:
    name: Plesk build validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sendflow_ci
          POSTGRES_PASSWORD: sendflow_ci
          POSTGRES_DB: sendflow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sendflow_ci -d sendflow_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_URL: ${{ vars.APP_URL || 'https://sendflow.africa' }}
      PUBLIC_URL: ${{ vars.PUBLIC_URL }}
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
      BASE_PATH: /
      NEON_DATABASE_URL: postgresql://sendflow_ci:sendflow_ci@127.0.0.1:5432/sendflow_ci
      PLESK_MEDIA_DIR: /tmp/sendflow-public-media-ci

    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Confirm the build does not depend on a checked-in dist
        run: |
          if [[ -e dist ]]; then
            echo "::error::A clean Git checkout should not contain dist; the release must be built from tracked source."
            exit 1
          fi

      - name: Build and package a standalone Plesk release
        run: pnpm run package:plesk

      - name: Install Chromium for rendered-page checks
        run: pnpm --filter @workspace/sendflow exec playwright install --with-deps chromium

      - name: Smoke-test the Plesk runtime bundle
        env:
          NEON_DATABASE_URL: postgresql://sendflow_ci:sendflow_ci@127.0.0.1:5432/sendflow_ci
        run: |
          set -euo pipefail
          port=4179
          log_file="$(mktemp)"
          smoke_dir=""
          (
            cd dist
            exec env NODE_ENV=production PORT="$port" PUBLIC_SITE_URL="$APP_URL" node ./index.cjs
          ) >"$log_file" 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            if [[ -n "$smoke_dir" ]]; then
              rm -rf "$smoke_dir"
            fi
            rm -f "$log_file"
          }
          trap cleanup EXIT

          ready=0
          for _ in $(seq 1 30); do
            if curl --silent --show-error --fail "http://127.0.0.1:$port/api/healthz" >/dev/null 2>&1; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$log_file"
              echo "::error::The production bundle exited before becoming healthy."
              exit 1
            fi
            sleep 1
          done
          if [[ "$ready" != 1 ]]; then
            cat "$log_file"
            echo "::error::The production bundle did not become healthy within 30 seconds."
            exit 1
          fi

          smoke_dir="$(mktemp -d)"
          while IFS= read -r route; do
            [[ -n "$route" ]] || continue
            status="$(curl --location --silent --show-error --output "$smoke_dir/page.html" --write-out '%{http_code}' \
              "http://127.0.0.1:$port$route")"
            if [[ "$status" != "200" ]]; then
              echo "::error::Generated public route $route returned HTTP $status."
              exit 1
            fi
          done < <(node -e '
            const routes = require("./artifacts/sendflow/src/lib/public-seo-routes.json");
            for (const group of Object.values(routes)) {
              for (const locale of ["fr", "en"]) console.log(group[locale].path);
            }
          ')

          health_json="$(curl --silent --show-error --fail "http://127.0.0.1:$port/api/healthz")"
          expected_build_id="$(node -p "require('./dist/build-info.json').buildId")"
          actual_build_id="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).buildId ?? "")' "$health_json")"
          if [[ -z "$expected_build_id" || "$actual_build_id" != "$expected_build_id" ]]; then
            echo "::error::The server did not load build-info.json from the Plesk application root (dist)."
            exit 1
          fi
          echo "Verified health endpoint uses Plesk package build ID $expected_build_id."

          while IFS='|' read -r route locale marker; do
            page_file="$smoke_dir/page.html"
            status="$(curl --silent --show-error --output "$page_file" --write-out '%{http_code}' \
              "http://127.0.0.1:$port$route")"
            if [[ "$status" != 200 ]]; then
              echo "::error::Local production route $route returned HTTP $status."
              exit 1
            fi

            if ! grep -Fq "<html lang=\"$locale\">" "$page_file"; then
              echo "::error::Local production route $route did not serve the expected $locale document."
              exit 1
            fi

            js_path="$(grep -oE 'src="[^"]+\.js"' "$page_file" | head -n 1 | cut -d '"' -f 2)"
            css_path="$(grep -oE 'href="[^"]+\.css"' "$page_file" | head -n 1 | cut -d '"' -f 2)"
            if [[ -z "$js_path" || -z "$css_path" ]]; then
              echo "::error::Local production route $route does not reference the expected JavaScript and CSS bundles."
              exit 1
            fi

            js_type="$(curl --silent --show-error --fail --output "$smoke_dir/app.js" --write-out '%{content_type}' \
              "http://127.0.0.1:$port$js_path")"
            css_type="$(curl --silent --show-error --fail --output "$smoke_dir/app.css" --write-out '%{content_type}' \
              "http://127.0.0.1:$port$css_path")"
            if [[ ! -s "$smoke_dir/app.js" || "$js_type" != *javascript* ]]; then
              echo "::error::The JavaScript bundle referenced by $route did not load as a JavaScript resource."
              exit 1
            fi
            if [[ ! -s "$smoke_dir/app.css" || "$css_type" != *text/css* ]]; then
              echo "::error::The stylesheet referenced by $route did not load as a CSS resource."
              exit 1
            fi
            if ! grep -R -Fq --include='*.js' "$marker" dist/public/assets; then
              echo "::error::The production JavaScript chunks are missing the expected localized content marker for $route: $marker"
              exit 1
            fi

            echo "Verified localized marker and compiled assets for $route."
          done <<'ROUTES'
          /|fr|L’argent circule.
          /fonctionnalites/|fr|Tout ce dont vous avez besoin pour envoyer
          /en/|en|Money moves.
          /en/features/|en|Everything you need to send and receive money simply
          ROUTES

          favicon_path="$(grep -oE 'href="[^"]*sendflow-favicon\.png"' "$smoke_dir/page.html" | head -n 1 | cut -d '"' -f 2)"
          if [[ -z "$favicon_path" ]]; then
            echo "::error::The production HTML does not reference the expected SendFlow favicon."
            exit 1
          fi
          favicon_type="$(curl --silent --show-error --fail --output "$smoke_dir/favicon.png" --write-out '%{content_type}' \
            "http://127.0.0.1:$port$favicon_path")"
          if [[ ! -s "$smoke_dir/favicon.png" || "$favicon_type" != *image/png* ]]; then
            echo "::error::The SendFlow favicon did not load as a PNG resource."
            exit 1
          fi

          pnpm --filter @workspace/sendflow run test:browser-smoke -- "http://127.0.0.1:$port"

      - name: Simulate the Passenger hook without PORT
        env:
          NEON_DATABASE_URL: postgresql://sendflow_ci:sendflow_ci@127.0.0.1:5432/sendflow_ci
        run: |
          set -euo pipefail
          port=4180
          log_file="$(mktemp)"
          passenger_shim="$(mktemp --suffix=.cjs)"
          cat >"$passenger_shim" <<'SHIM'
          const assert = require("node:assert/strict");
          const http = require("node:http");
          const originalListen = http.Server.prototype.listen;
          let configured = false;

          globalThis.PhusionPassenger = {
            configure(options) {
              assert.deepEqual(options, { autoInstall: false });
              assert.equal(configured, false, "Passenger configure should run once");
              configured = true;
              console.log("PASSENGER_SIMULATION_CONFIGURE_OK");
            },
          };

          http.Server.prototype.listen = function (...args) {
            assert.equal(configured, true, "Passenger configure must run before listen");
            assert.equal(args[0], "passenger", "application must call listen('passenger')");
            assert.equal(args.length, 2, "expected listen('passenger', callback)");
            console.log("PASSENGER_SIMULATION_LISTEN_OK");
            return originalListen.call(
              this,
              Number(process.env.PASSENGER_SIMULATION_PORT),
              "127.0.0.1",
              args[1],
            );
          };
          SHIM

          cleanup() {
            if [[ -n "${server_pid:-}" ]]; then
              kill "$server_pid" 2>/dev/null || true
              wait "$server_pid" 2>/dev/null || true
            fi
            rm -f "$log_file" "$passenger_shim"
          }
          trap cleanup EXIT

          (
            cd dist
            exec env -u PORT NODE_ENV=production \
              NODE_OPTIONS="--require=$passenger_shim" \
              PASSENGER_SIMULATION_PORT="$port" \
              PUBLIC_SITE_URL="$APP_URL" \
              node ./index.cjs
          ) >"$log_file" 2>&1 &
          server_pid=$!

          ready=0
          for _ in $(seq 1 30); do
            if curl --silent --show-error --fail "http://127.0.0.1:$port/api/healthz" >/dev/null 2>&1; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$log_file"
              echo "::error::The Passenger-simulated production bundle exited before becoming healthy."
              exit 1
            fi
            sleep 1
          done
          if [[ "$ready" != 1 ]]; then
            cat "$log_file"
            echo "::error::The Passenger-simulated production bundle did not become healthy within 30 seconds."
            exit 1
          fi

          for marker in PASSENGER_SIMULATION_CONFIGURE_OK PASSENGER_SIMULATION_LISTEN_OK; do
            if ! grep -q "$marker" "$log_file"; then
              cat "$log_file"
              echo "::error::The Passenger simulation did not verify $marker."
              exit 1
            fi
          done

          for route in / /fonctionnalites/ /en/; do
            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              "http://127.0.0.1:$port$route")"
            if [[ "$status" != 200 ]]; then
              echo "::error::Passenger-simulated public route $route returned HTTP $status."
              exit 1
            fi
          done

      - name: Upload Plesk release package
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: sendflow-plesk-${{ github.sha }}
          path: generated-artifacts/sendflow-plesk-*.tar.gz
          if-no-files-found: error
          retention-days: 14

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Fail on high or critical dependency vulnerabilities
        run: pnpm audit --audit-level high

  static-analysis:
    name: Static security analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan source with Semgrep security rules
        env:
          BASELINE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            -w /src \
            semgrep/semgrep:1.136.0 \
            semgrep scan \
              --config p/security-audit \
              --baseline-commit "$BASELINE_REF" \
              --error \
              --metrics=off \
              --exclude=attached_assets \
              --exclude=generated-artifacts \
              --exclude=dist \
              --exclude=node_modules \
              --exclude=.cache \
              .

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the full commit history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository history with Gitleaks
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            -w /repo \
            zricethezav/gitleaks:v8.24.2 \
            detect \
              --source=/repo \
              --redact \
              --exit-code=1 \
              --no-banner

  build:
    runs-on: ubuntu-latest
    needs:
      - plesk-build
      - dependency-audit
      - static-analysis
      - secret-scan
    if: always()
    permissions:
      contents: read
    steps:
      - name: Fail unless every validation passed
        env:
          PLESK_BUILD_RESULT: ${{ needs.plesk-build.result }}
          DEPENDENCY_AUDIT_RESULT: ${{ needs.dependency-audit.result }}
          STATIC_ANALYSIS_RESULT: ${{ needs.static-analysis.result }}
          SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
        run: |
          set -euo pipefail
          failed=0
          for result in \
            "$PLESK_BUILD_RESULT" \
            "$DEPENDENCY_AUDIT_RESULT" \
            "$STATIC_ANALYSIS_RESULT" \
            "$SECRET_SCAN_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "::error::A required validation did not pass (result: $result)."
              failed=1
            fi
          done
          exit "$failed"

  deploy-plesk:
    name: Deploy validated build to Plesk
    runs-on: ubuntu-latest
    needs:
      - plesk-build
      - build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    env:
      PLESK_SSH_HOST: ${{ vars.PLESK_SSH_HOST }}
      PLESK_SSH_USER: ${{ vars.PLESK_SSH_USER }}
      PLESK_SSH_PORT: ${{ vars.PLESK_SSH_PORT || '22' }}
      PLESK_DEPLOY_ROOT: ${{ vars.PLESK_DEPLOY_ROOT || '/var/www/vhosts/sendflow.africa/sendflow.africa' }}
      RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out the validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download the validated Plesk package
        uses: actions/download-artifact@v4
        with:
          name: sendflow-plesk-${{ github.sha }}
          path: generated-artifacts

      - name: Validate Plesk SSH settings
        env:
          PLESK_SSH_PRIVATE_KEY: ${{ secrets.PLESK_SSH_PRIVATE_KEY }}
          PLESK_SSH_KNOWN_HOSTS: ${{ vars.PLESK_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for name in PLESK_SSH_HOST PLESK_SSH_USER PLESK_SSH_PRIVATE_KEY PLESK_SSH_KNOWN_HOSTS; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub Actions setting: $name. Configure the Plesk SSH deployment values described in PLESK_DEPLOYMENT.md."
              exit 1
            fi
          done
          if [[ ! "$PLESK_SSH_HOST" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo "::error::PLESK_SSH_HOST must be a hostname or IPv4 address."
            exit 1
          fi
          if [[ ! "$PLESK_SSH_USER" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::PLESK_SSH_USER contains unsupported characters."
            exit 1
          fi
          if [[ ! "$PLESK_SSH_PORT" =~ ^[0-9]{1,5}$ ]]; then
            echo "::error::PLESK_SSH_PORT must be a TCP port number."
            exit 1
          fi
          port_number=$((10#$PLESK_SSH_PORT))
          if (( port_number < 1 || port_number > 65535 )); then
            echo "::error::PLESK_SSH_PORT must be between 1 and 65535."
            exit 1
          fi
          if [[ ! "$PLESK_DEPLOY_ROOT" =~ ^/[A-Za-z0-9._/-]+$ || "$PLESK_DEPLOY_ROOT" == *"/../"* ]]; then
            echo "::error::PLESK_DEPLOY_ROOT must be an absolute path without spaces or parent-directory segments."
            exit 1
          fi
          if [[ "$(basename -- "$PLESK_DEPLOY_ROOT")" != "sendflow.africa" ]]; then
            echo "::error::PLESK_DEPLOY_ROOT must be the sendflow.africa deployment directory."
            exit 1
          fi
          archive="$(find generated-artifacts -maxdepth 2 -type f -name 'sendflow-plesk-*.tar.gz' -print -quit)"
          if [[ -z "$archive" || ! -s "$archive" ]]; then
            echo "::error::The validated Plesk release archive was not downloaded."
            exit 1
          fi
          echo "Plesk SSH configuration and release package are present."

      - name: Install the pinned Plesk SSH host key and deploy key
        env:
          PLESK_SSH_PRIVATE_KEY: ${{ secrets.PLESK_SSH_PRIVATE_KEY }}
          PLESK_SSH_KNOWN_HOSTS: ${{ vars.PLESK_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$PLESK_SSH_PRIVATE_KEY" > "$HOME/.ssh/sendflow-plesk"
          printf '%s\n' "$PLESK_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          test -s "$HOME/.ssh/sendflow-plesk"
          test -s "$HOME/.ssh/known_hosts"

      - name: Upload the release and atomically replace dist on Plesk
        run: |
          set -euo pipefail
          archive="$(find generated-artifacts -maxdepth 2 -type f -name 'sendflow-plesk-*.tar.gz' -print -quit)"
          remote_archive="$PLESK_DEPLOY_ROOT/.sendflow-upload-${RELEASE_ID}.tar.gz"
          ssh_options=(
            -i "$HOME/.ssh/sendflow-plesk"
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -p "$PLESK_SSH_PORT"
          )
          scp_options=(
            -i "$HOME/.ssh/sendflow-plesk"
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -P "$PLESK_SSH_PORT"
          )
          scp "${scp_options[@]}" "$archive" "$PLESK_SSH_USER@$PLESK_SSH_HOST:$remote_archive"
          printf -v remote_command 'bash -s -- %q %q %q' \
            "$PLESK_DEPLOY_ROOT" "$RELEASE_ID" "$remote_archive"
          ssh "${ssh_options[@]}" "$PLESK_SSH_USER@$PLESK_SSH_HOST" "$remote_command" \
            < scripts/plesk-remote-deploy.sh
