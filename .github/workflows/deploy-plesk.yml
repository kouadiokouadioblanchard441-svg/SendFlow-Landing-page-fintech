name: Build and deploy SendFlow to Plesk

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sendflow-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ vars.APP_URL || 'https://sendflow.africa' }}
      PUBLIC_URL: ${{ vars.PUBLIC_URL }}
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
      BASE_PATH: /
      PUBLIC_CHECK_URL: ${{ vars.APP_URL || vars.PUBLIC_URL || vars.PUBLIC_SITE_URL || 'https://sendflow.africa' }}

    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Build production files
        run: pnpm run deploy:plesk

      - name: Smoke-test the Plesk runtime bundle
        run: |
          set -euo pipefail
          port=4179
          log_file="$(mktemp)"
          (
            cd dist
            exec env NODE_ENV=production PORT="$port" PUBLIC_SITE_URL="$APP_URL" node ./index.cjs
          ) >"$log_file" 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            rm -f "$log_file"
          }
          trap cleanup EXIT

          ready=0
          for _ in $(seq 1 30); do
            if curl --silent --show-error --fail "http://127.0.0.1:$port/api/healthz" >/dev/null 2>&1; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$log_file"
              echo "::error::The production bundle exited before becoming healthy."
              exit 1
            fi
            sleep 1
          done
          if [[ "$ready" != 1 ]]; then
            cat "$log_file"
            echo "::error::The production bundle did not become healthy within 30 seconds."
            exit 1
          fi

          for route in / /fonctionnalites/ /en/; do
            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              "http://127.0.0.1:$port$route")"
            if [[ "$status" != 200 ]]; then
              echo "::error::Local production route $route returned HTTP $status."
              exit 1
            fi
          done

      - name: Prepare SSH
        env:
          PLESK_HOST: ${{ secrets.PLESK_HOST }}
          PLESK_PORT: ${{ secrets.PLESK_PORT }}
          PLESK_USER: ${{ secrets.PLESK_USER }}
          PLESK_APP_ROOT: ${{ secrets.PLESK_APP_ROOT }}
          PLESK_SSH_PRIVATE_KEY: ${{ secrets.PLESK_SSH_PRIVATE_KEY }}
          PLESK_KNOWN_HOSTS: ${{ secrets.PLESK_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for name in PLESK_HOST PLESK_PORT PLESK_USER PLESK_APP_ROOT PLESK_SSH_PRIVATE_KEY PLESK_KNOWN_HOSTS; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub secret: $name"
              exit 1
            fi
          done
          [[ "$PLESK_PORT" =~ ^[0-9]+$ ]] || { echo "::error::PLESK_PORT must be numeric"; exit 1; }
          [[ "$PLESK_APP_ROOT" =~ ^/[A-Za-z0-9_./-]+$ ]] || { echo "::error::PLESK_APP_ROOT must be an absolute path"; exit 1; }
          [[ ! "$PLESK_APP_ROOT" =~ (^|/)\.\.(/|$) ]] || { echo "::error::PLESK_APP_ROOT cannot contain .."; exit 1; }
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$PLESK_SSH_PRIVATE_KEY" > "$HOME/.ssh/plesk_deploy"
          printf '%s\n' "$PLESK_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/plesk_deploy" "$HOME/.ssh/known_hosts"

      - name: Upload build and restart the Plesk app
        env:
          PLESK_HOST: ${{ secrets.PLESK_HOST }}
          PLESK_PORT: ${{ secrets.PLESK_PORT }}
          PLESK_USER: ${{ secrets.PLESK_USER }}
          PLESK_APP_ROOT: ${{ secrets.PLESK_APP_ROOT }}
        run: |
          set -euo pipefail
          key="$HOME/.ssh/plesk_deploy"
          target="${PLESK_USER}@${PLESK_HOST}"
          release="${PLESK_APP_ROOT}.release-${GITHUB_SHA}"
          ssh_opts=(-i "$key" -p "$PLESK_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)

          ssh "${ssh_opts[@]}" "$target" "mkdir -p '$release'"
          rsync -az --delete -e "ssh -i $key -p $PLESK_PORT -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            dist/ "$target:$release/"

          ssh "${ssh_opts[@]}" "$target" bash -s -- "$PLESK_APP_ROOT" "$GITHUB_SHA" <<'REMOTE'
          set -euo pipefail
          app_root="$1"
          release="${app_root}.release-$2"
          test -s "$release/package.json"
          test -s "$release/index.cjs"
          test -s "$release/public/index.html"
          test -s "$release/public/sitemap.xml"
          test -s "$release/public/robots.txt"

          mkdir -p "$app_root"
          rsync -a --delete --exclude='/tmp/' "$release/" "$app_root/"
          test -s "$app_root/index.cjs"
          test -s "$app_root/package.json"
          test -s "$app_root/public/index.html"
          test -s "$app_root/public/sitemap.xml"
          test -s "$app_root/public/robots.txt"
          rm -rf "$release"
          mkdir -p "$app_root/tmp"
          touch "$app_root/tmp/restart.txt"
          REMOTE

      - name: Verify the public Plesk deployment
        run: |
          set -euo pipefail
          base_url="${PUBLIC_CHECK_URL%/}"

          check_url() {
            local path="$1"
            local output_file
            output_file="$(mktemp)"
            if ! curl --silent --show-error --fail \
              --retry 12 --retry-delay 5 --retry-all-errors --max-time 15 \
              --output "$output_file" "${base_url}${path}"; then
              echo "::error::Production check failed for ${base_url}${path}."
              sed -n '1,25p' "$output_file" >&2
              rm -f "$output_file"
              return 1
            fi
            rm -f "$output_file"
          }

          check_url /api/healthz
          check_url /
          check_url /fonctionnalites/
          check_url /en/
